<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="/FRONTEND/style.css">
</head>

<body>

    <div class="decoracao-zigzag"></div>

    <div class="container">

        <!-- Foto -->
        <img src="/FRONTEND/IMG/IMG_20260822_143746_846.webp">
        <h1>Cadastro de Produtos</h1>

        <form id="produto-form">

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                required
            >

            <label for="preco">Preço:</label>
            <input
                type="number"
                id="preco"
                min="0.01"
                step="0.01"
                required
            >

            <label for="quantidade">Quantidade:</label>
            <input
                type="number"
                id="quantidade"
                min="1"
                step="1"
                required
            >

            <button type="submit">
                Adicionar Produto
            </button>

        </form>

        <button id="limpar-tabela">
            Limpar tabela
        </button>

        <h3 id="total-estoque">
            Total em Estoque: R$ 0.00
        </h3>

        <table id="tabela-produtos">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Total item</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

    <script src="/FRONTEND/script.js"></script>

</body>

</html>
