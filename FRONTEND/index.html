<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    ```
    <title>Cadastro de Produtos</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="/FRONTEND/style.css">
    ```

</head>

<body>

    ```
    <!-- ========================= -->
    <!-- TELA DE LOGIN -->
    <!-- ========================= -->

    <div id="tela-login" class="container login-container">

        <img src="/FRONTEND/IMG_20260822_143746_846.webp" class="foto-perfil">

        <h1>Bem-vindo!</h1>

        <p class="subtitulo">Entre para acessar o cadastro de produtos</p>

        <form id="login-form">

            <label for="login-email">E-mail:</label>

            <input type="email" id="login-email" placeholder="Digite seu e-mail" required>

            <label for="login-senha">Senha:</label>

            <input type="password" id="login-senha" placeholder="Digite sua senha" required>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="cadastro-link">
            Ainda não possui uma conta?
            <button type="button" id="mostrar-cadastro">
                Criar cadastro
            </button>
        </p>

    </div>


    <!-- ========================= -->
    <!-- TELA DE CADASTRO -->
    <!-- ========================= -->

    <div id="tela-cadastro" class="container login-container escondido">

        <img src="/FRONTEND/IMG_20260822_143746_846.webp" class="foto-perfil">

        <h1>Criar conta</h1>

        <p class="subtitulo">Cadastre-se para acessar o sistema</p>

        <form id="cadastro-form">

            <label for="cadastro-nome">Nome:</label>

            <input type="text" id="cadastro-nome" placeholder="Digite seu nome" required>

            <label for="cadastro-email">E-mail:</label>

            <input type="email" id="cadastro-email" placeholder="Digite seu e-mail" required>

            <label for="cadastro-senha">Senha:</label>

            <input type="password" id="cadastro-senha" placeholder="Mínimo de 6 caracteres" minlength="6" required>

            <button type="submit">
                Criar conta
            </button>

        </form>

        <p class="cadastro-link">
            Já possui uma conta?
            <button type="button" id="voltar-login">
                Voltar para o login
            </button>
        </p>

    </div>


    <!-- ========================= -->
    <!-- TELA DE PRODUTOS -->
    <!-- ========================= -->

    <div id="tela-produtos" class="container escondido">

        <div class="cabecalho-usuario">

            <div>
                <strong id="nome-usuario">
                    Usuário
                </strong>

                <span id="perfil-usuario">
                    Cliente
                </span>
            </div>

            <button type="button" id="botao-sair" class="botao-sair">
                Sair
            </button>

        </div>

        <img src="/FRONTEND/IMG_20260822_143746_846.webp" class="foto-perfil">

        <h1>Cadastro de Produtos</h1>

        <form id="produto-form">

            <label for="nome">Nome:</label>

            <input type="text" id="nome" required>

            <label for="preco">Preço:</label>

            <input type="number" id="preco" min="0.01" step="0.01" required>

            <label for="quantidade">Quantidade:</label>

            <input type="number" id="quantidade" min="1" step="1" required>

            <button type="submit">
                Adicionar Produto
            </button>

        </form>

        <button id="limpar-tabela">
            Limpar tabela
        </button>

        <h3 id="total-estoque">
            Total em Estoque: R$ 0.00
        </h3>

        <table id="tabela-produtos">

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Total item</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody></tbody>

        </table>

    </div>

    <script src="/FRONTEND/script.js"></script>
    ```

</body>

</html>
